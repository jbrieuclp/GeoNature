<div *ngIf="!autoGenerated">
  <small>{{ selectLabel }}</small>
  <div class="input-group filter-control">
    <select
      class="form-control form-control-sm"
      [formControl]="selectControl"
    >
      <option [ngValue]="null"></option>
      <option
        *ngFor="let formDef of formsDefinition"
        [ngValue]="formDef"
      >
        {{ formDef?.attribut_label }}
      </option>
    </select>
  </div>
</div>

<ng-template
  #formDefField
  let-formDef
  let-i="i"
>
  <pnx-dynamic-form
    class="dynamic-form padding-sm"
    [formDef]="formDef"
    [form]="myFormGroup"
    [update]="update"
  ></pnx-dynamic-form>
  <i
    *ngIf="!autoGenerated"
    class="fa fa-trash-o clickable trash-btn"
    (click)="removeFormControl(i)"
    aria-hidden="true"
  ></i>
</ng-template>

<div
  class="full-wrapper"
  *ngIf="formControlBuilded"
>
  <ng-container *ngFor="let formDef of formsDisplayed; let i = index">
    <div
      class="dynamic-form-row"
      *ngIf="isFormDefGroup(formDef); else displayedField"
    >
      <div
        class="dynamic-form-wrapper"
        *ngFor="let groupedFormDef of formDef"
      >
        <ng-container
          *ngTemplateOutlet="formDefField; context: { $implicit: groupedFormDef, i: i }"
        ></ng-container>
      </div>
    </div>
    <ng-template #displayedField>
      <div class="dynamic-form-wrapper">
        <ng-container
          *ngTemplateOutlet="formDefField; context: { $implicit: formDef, i: i }"
        ></ng-container>
      </div>
    </ng-template>
  </ng-container>
  <ng-container *ngFor="let formDef of formsHidden; let i = index">
    <div
      hidden
      class="dynamic-form-row"
      *ngIf="isFormDefGroup(formDef); else hiddenField"
    >
      <div
        class="dynamic-form-wrapper"
        *ngFor="let groupedFormDef of formDef"
      >
        <ng-container
          *ngTemplateOutlet="formDefField; context: { $implicit: groupedFormDef, i: i }"
        ></ng-container>
      </div>
    </div>
    <ng-template #hiddenField>
      <div
        hidden
        class="dynamic-form-wrapper"
      >
        <ng-container
          *ngTemplateOutlet="formDefField; context: { $implicit: formDef, i: i }"
        ></ng-container>
      </div>
    </ng-template>
  </ng-container>
</div>
